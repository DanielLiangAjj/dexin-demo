<script>
window.DXPAGE=function(){
  const U=window.DXUI, D=window.DX, bi=U.bi;
  const id=+new URLSearchParams(location.search).get('id');
  const p=D.products.find(x=>x.id===id);
  const pdEl=document.getElementById('pd');
  if(!p){
    document.getElementById('related-sec').style.display='none';
    document.getElementById('pd-title').innerHTML=bi('Product not found','未找到该产品');
    pdEl.innerHTML=`<div style="max-width:620px">
      <p class="lead"><span data-en>The product you're looking for doesn't exist or may have moved. Browse our full catalog to find the right material.</span><span data-zh>您查找的产品不存在或已调整。欢迎浏览完整产品目录，找到合适的材料。</span></p>
      <a class="btn" href="products.html" style="margin-top:28px">${bi('Browse all products','浏览全部产品')}</a></div>`;
    return;
  }
  const cat=D.cats.find(c=>c.slug===p.cat)||{};
  const nameActive=U.esc(U.lang==='zh'?p.zh:p.en);
  // per-product SEO: title, description, canonical, Product JSON-LD
  const pageUrl='https://szdexintc.com/product.html?id='+p.id;
  document.title=p.zh+' '+p.en+' · 德鑫陶瓷 Dexin';
  const md=document.querySelector('meta[name="description"]');
  if(md) md.setAttribute('content',p.blurb_zh+' '+p.blurb_en);
  const canon=document.createElement('link'); canon.rel='canonical'; canon.href=pageUrl; document.head.appendChild(canon);
  const ld=document.createElement('script'); ld.type='application/ld+json';
  ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Product',
    name:p.en, alternateName:p.zh, description:p.blurb_zh+' '+p.blurb_en,
    image:'https://szdexintc.com/'+p.img, url:pageUrl, category:(cat.en||''), brand:{'@type':'Brand',name:'DEXIN'},
    manufacturer:{'@type':'Organization',name:'Suzhou Dexin Advanced Ceramics Co., Ltd.',url:'https://szdexintc.com/'}});
  document.head.appendChild(ld);
  const catLink=document.getElementById('pd-cat'); catLink.href='products.html?cat='+p.cat; catLink.innerHTML=bi(cat.en||'',cat.zh||'');
  document.getElementById('pd-title').innerHTML=bi(p.en,p.zh);
  document.getElementById('pd-hero-quote').dataset.rfqProduct=(U.lang==='zh'?p.zh:p.en);
  const catImg={filters:'assets/img/process/filters_all.jpg',insulation:'assets/img/site/factory_kiln.jpg',casting:'assets/img/site/hand_pour.jpg'}[p.cat];
  if(catImg) document.getElementById('pd-frame').innerHTML=`<div class="frame is-on"><span class="flag" aria-hidden="true"></span>
    <div class="shot"><img src="${catImg}" alt="" width="1200" height="1200"></div>
    <div class="window"><h2 class="h3">${bi(cat.en||'',cat.zh||'')}</h2><p>${bi(cat.tag_en||'',cat.tag_zh||'')}</p></div></div>`;
  const gal=(p.gallery&&p.gallery.length?p.gallery:[p.img]);
  const thumbs=gal.length>1 ? `<div class="pd-thumbs">${gal.map((g,i)=>`<button type="button" class="${i===0?'active':''}" data-src="${g}" aria-label="Photo ${i+1}" aria-pressed="${i===0}"><img src="${g}" alt="" loading="lazy" width="160" height="160"></button>`).join('')}</div>` : '';
  const specRows=(p.specs||[]).map(s=>`<tr><th scope="row">${bi(s.en,s.zh)}</th><td>${U.val(s.v)}</td></tr>`).join('');
  // multi-grade datasheet (one column per grade), shown full width under the product
  const G=p.grades;
  const gradeTable=G ? `<div class="grades"><h2 class="h3">${bi(G.title_en,G.title_zh)}</h2>
      <div class="grade-scroll" tabindex="0" role="region" aria-label="${U.esc(G.title_en)}"><table class="grade-table">
        <thead><tr><th scope="col"><span class="vh">${bi('Property','项目')}</span></th>${G.cols.map((c,i)=>`<th scope="col"><span class="code">${U.val(c)}</span><span class="nm">${bi(G.names_en[i],G.names_zh[i])}</span></th>`).join('')}</tr></thead>
        <tbody>${G.rows.map(r=>`<tr><th scope="row">${bi(r.en,r.zh)}</th>${r.v.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div></div>` : '';
  const trApp=(L,a)=>((window.DX_I18N&&window.DX_I18N[L]&&window.DX_I18N[L][a])||a);
  const li=a=>`<li><span class="sq"></span>${a}</li>`;
  const enChips=(p.apps_en||[]).map(li).join(''), zhChips=(p.apps_zh||[]).map(li).join('');
  const esChips=(p.apps_en||[]).map(a=>li(trApp('es',a))).join(''), arChips=(p.apps_en||[]).map(a=>li(trApp('ar',a))).join('');
  pdEl.innerHTML=`<div class="pd-grid">
    <div class="pd-gallery">
      <div class="main">${p.mark?`<span class="type-plate" role="img" aria-label="${U.esc(p.en)}: photo to come" data-mark="${p.mark}"><span class="pend">${bi('Photo to come','图片待更新')}</span></span>`:`<img id="pd-main" src="${gal[0]}" alt="${U.esc(p.en)}" width="900" height="900">`}</div>
      ${p.mark?'':thumbs}
    </div>
    <div class="pd-info">
      <p class="desc">${bi(p.blurb_en,p.blurb_zh)}</p>
      <table class="spec-table"><caption class="vh">${bi('Specifications','规格')}</caption><tbody>${specRows}</tbody></table>
      <p class="spec-cap">${bi('Standard specifications — sizes, porosity and geometry can be customised to your process.','标准规格——尺寸、气孔率与外形可按您的工艺定制。')}</p>
      <div class="pd-apps"><h2 class="h3">${bi('Typical applications','典型应用')}</h2>
        <ul class="chips" data-en data-i18n-es="1" data-i18n-ar="1">${enChips}</ul>
        <ul class="chips" data-zh>${zhChips}</ul>
        <ul class="chips" data-es>${esChips}</ul>
        <ul class="chips" data-ar>${arChips}</ul>
      </div>
      <div class="pd-actions">
        <a class="btn" href="contact.html#quote" data-rfq data-rfq-type="quote" data-rfq-product="${nameActive}">${bi('Request a Quote','获取报价')}</a>
        <a class="btn btn-navy" href="contact.html#quote" data-rfq data-rfq-type="sample" data-rfq-product="${nameActive}">${bi('Request a Sample','申请样品')}</a>
        <a class="link" href="contact.html#quote" id="pd-dl">${bi('Request datasheet','索取产品资料')} ${U.svg('arrow',2)}</a>
      </div>
      <p class="pd-certs">${D.certs.slice(0,4).map(c=>c.code).join(' · ')} — ${bi('Backed by our ISO 9001 quality system and industry credentials.','由 ISO 9001 质量体系与行业资质保障。')}</p>
    </div>
  </div>${gradeTable}`;
  const mainImg=document.getElementById('pd-main');
  if(mainImg) pdEl.querySelectorAll('.pd-thumbs button').forEach(b=>{
    b.addEventListener('click',()=>{
      mainImg.style.opacity='0';
      setTimeout(()=>{ mainImg.src=b.dataset.src; mainImg.style.opacity='1'; },U.reduced?0:180);
      pdEl.querySelectorAll('.pd-thumbs button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b?'true':'false');});
    });
  });
  document.getElementById('pd-dl').addEventListener('click',e=>{
    e.preventDefault();
    U.openRFQ((U.lang==='zh'?p.zh:p.en)+({zh:'（索取产品资料）',es:' (solicitud de ficha técnica)',ar:' (طلب ورقة بيانات)'}[U.lang]||' (datasheet request)'),'quote');
  });
  const related=D.products.filter(x=>x.cat===p.cat && x.id!==p.id).slice(0,4);
  if(related.length) document.getElementById('related').innerHTML=related.map(U.productRow).join('');
  else document.getElementById('related-sec').style.display='none';
};
</script>
