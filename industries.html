<script>
window.DXPAGE = function(){
  const U = window.DXUI, D = window.DX, bi = U.bi;
  const wrap = document.getElementById('industryWrap');
  wrap.innerHTML = D.industries.map((ind, i) => {
    const prods = (ind.pids || []).map(id => D.products.find(p => p.id === id)).filter(Boolean);
    return `<section class="band ${i%2?'g-paper':'g-white'}" id="${ind.slug}" aria-labelledby="ind-${ind.slug}">
      <div class="wrap">
        <div class="ind-block">
          <div class="pic" data-rise><img src="${ind.img}" alt="${U.esc(ind.en)}" loading="lazy" style="object-position:${ind.pos||'center'}" width="1200" height="900"></div>
          <div data-rise><h2 class="cap" id="ind-${ind.slug}">${bi(ind.en,ind.zh)}</h2><p>${bi(ind.desc_en,ind.desc_zh)}</p></div>
        </div>
        <div class="plist">${prods.map(U.productRow).join('')}</div>
      </div>
    </section>`;
  }).join('');
  const slug = new URLSearchParams(location.search).get('ind');
  if(slug){ const el=document.getElementById(slug); if(el) setTimeout(()=>el.scrollIntoView({behavior:U.reduced?'auto':'smooth',block:'start'}),240); }
};
</script>
